<ul>
    <?php
    // Seznam souborů z PHP
    foreach ($files as $file) {
        echo "<li>$file 
            <a href='process.php?readFile=$file' target='_blank'>Číst</a> | 
            <a href='#' onclick=\"editFile('$file')\">Upravit</a> | 
            <a href='#' onclick=\"deleteFile('$file')\">Smazat</a>
            </li>";
    }
    ?>
</ul>

<!-- Sekce pro úpravu souboru -->
<h2>Upravit soubor</h2>
<form method="POST" id="editForm" style="display:none;" action="process.php">
    <input type="text" name="fileName" id="editFileName" readonly><br><br>
    <textarea name="fileContent" id="editFileContent" rows="4" cols="50" required></textarea><br><br>
    <button type="submit" name="editFile">Upravit soubor</button>
</form>

<!-- Sekce pro mazání souboru -->
<script>
    function editFile(fileName) {
        fetch('uploads/' + fileName)
            .then(response => response.text())
            .then(content => {
                document.getElementById('editFileName').value = fileName;
                document.getElementById('editFileContent').value = content;
                document.getElementById('editForm').style.display = 'block';
            });
    }

    function deleteFile(fileName) {
        if (confirm('Opravdu chcete tento soubor smazat?')) {
            const form = document.createElement('form');
            form.method = 'POST';
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = 'deleteFile';
            input.value = fileName;
            form.appendChild(input);
            document.body.appendChild(form);
            form.submit();
        }
    }
</script>

</body>
